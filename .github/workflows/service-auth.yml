name: Service - Auth Service CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/services/auth-service/**'
      - 'packages/service-kit/**'
      - 'packages/shared/**'
      - '.github/workflows/service-auth.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/services/auth-service/**'
      - 'packages/service-kit/**'
      - 'packages/shared/**'
      - '.github/workflows/service-auth.yml'

concurrency:
  group: service-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-auth:
    name: Verify Auth Service (Port 8081)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm --workspace=@opsgraph/shared run build
          npm --workspace=@opsgraph/service-kit run build

      - name: TypeCheck Auth Service
        run: npm --workspace=@opsgraph/auth-service run typecheck

      - name: Compile Auth Service
        run: npm --workspace=@opsgraph/auth-service run build

      - name: Verify Compiled Output & Entrypoint
        run: |
          node -e "
            import('./apps/services/auth-service/package.json', { with: { type: 'json' } }).then(pkg => {
              console.log('✓ Verified @opsgraph/auth-service package metadata:', pkg.default.name);
            });
          "
