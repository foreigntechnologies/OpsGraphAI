name: Service - API Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/services/api-gateway/**'
      - 'packages/service-kit/**'
      - 'packages/shared/**'
      - '.github/workflows/service-api-gateway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/services/api-gateway/**'
      - 'packages/service-kit/**'
      - 'packages/shared/**'
      - '.github/workflows/service-api-gateway.yml'

concurrency:
  group: service-api-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-gateway:
    name: Verify API Gateway (Port 8080)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm --workspace=@opsgraph/shared run build
          npm --workspace=@opsgraph/service-kit run build

      - name: TypeCheck API Gateway
        run: npm --workspace=@opsgraph/api-gateway run typecheck

      - name: Compile API Gateway
        run: npm --workspace=@opsgraph/api-gateway run build

      - name: Verify Compiled Output & Entrypoint
        run: |
          node -e "
            import('./apps/services/api-gateway/package.json', { with: { type: 'json' } }).then(pkg => {
              console.log('✓ Verified @opsgraph/api-gateway package metadata:', pkg.default.name);
            });
          "
