name: Service - Notifications Service CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/services/notifications-service/**'
      - 'packages/service-kit/**'
      - 'packages/shared/**'
      - '.github/workflows/service-notifications.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/services/notifications-service/**'
      - 'packages/service-kit/**'
      - 'packages/shared/**'
      - '.github/workflows/service-notifications.yml'

concurrency:
  group: service-notifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-notifications:
    name: Verify Notifications Service (Port 8084)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm --workspace=@opsgraph/shared run build
          npm --workspace=@opsgraph/service-kit run build

      - name: TypeCheck Notifications Service
        run: npm --workspace=@opsgraph/notifications-service run typecheck

      - name: Compile Notifications Service
        run: npm --workspace=@opsgraph/notifications-service run build

      - name: Verify Notifications Service Entrypoint
        run: |
          node -e "
            import('./apps/services/notifications-service/package.json', { with: { type: 'json' } }).then(pkg => {
              console.log('✓ Verified @opsgraph/notifications-service package metadata:', pkg.default.name);
            });
          "
