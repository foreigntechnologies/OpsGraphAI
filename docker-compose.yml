version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: opsgraph-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  loki:
    image: grafana/loki:3.0.0
    container_name: opsgraph-loki
    user: "0:0"
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/config.yaml

  tempo:
    image: grafana/tempo:2.4.1
    container_name: opsgraph-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    command: -config.file=/etc/tempo/tempo.yaml

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: opsgraph-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - tempo
      - loki

  grafana:
    image: grafana/grafana:10.4.1
    container_name: opsgraph-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  postgres:
    image: postgres:16-alpine
    container_name: opsgraph-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=opsgraph
      - POSTGRES_PASSWORD=opsgraph
      - POSTGRES_DB=shop
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: opsgraph-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  postgres-data:
  qdrant-data:
